[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-policy-lab"
version = "0.1.0"
description = "A headless MuJoCo imitation learning and demonstration data lab"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mujoco==3.3.2",
  "numpy==2.2.6",
  "pyarrow==19.0.1",
  "torch==2.6.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.13"]

[project.scripts]
robot-policy-lab = "robot_policy_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_policy_lab = ["models/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["robot_policy_lab"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
