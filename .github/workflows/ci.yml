name: Robot policy CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robot-policy-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.11.13
      - run: ruff check .
      - name: Reject em dash characters
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              assert '\u2014' not in Path(name).read_text(), f'em dash in {name}'
          PY

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: >-
          pytest --cov --cov-report=term-missing --cov-report=json:artifacts/coverage.json
          --cov-report=html:artifacts/htmlcov --junitxml=artifacts/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e .
      - run: bash scripts/benchmark.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: demonstration-dataset
          path: data/

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t robot-policy-lab .
      - name: Run packaged model and generate demonstrations
        run: docker run --rm robot-policy-lab generate-data --output /tmp/data --episodes 2

  publish-results:
    needs: [lint, tests, benchmark, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-results'
          merge-multiple: true
          path: artifacts
      - run: python scripts/publish_results.py
      - name: Commit measured results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md reports
          if ! git diff --cached --quiet; then
            git commit -m 'Update measured CI results'
            git push
          fi
